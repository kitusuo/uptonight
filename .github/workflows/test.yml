name: Tests

on:
  # Pull requests cover branch development; push only on main (post-merge) so a
  # PR branch does not run twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - name: Sync environment (Python from .python-version + locked deps)
        run: uv sync --frozen

      - name: Run tests with coverage
        # The 90% gate on the uptonight/ package is enforced via fail_under in
        # pyproject.toml [tool.coverage.report].
        run: uv run pytest --cov=uptonight --cov-report=term-missing
