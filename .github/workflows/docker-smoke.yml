name: Docker smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: uptonight:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container (one-shot)
        # No config file is mounted: UpTonight reads these env overrides. A
        # mid-latitude winter night guarantees a non-empty result. comets/mqtt
        # stay off by default.
        run: |
          mkdir -p smoke-out
          docker run --rm \
            -e LATITUDE=48.14 \
            -e LONGITUDE=11.58 \
            -e ELEVATION=519 \
            -e TIMEZONE=Europe/Berlin \
            -e OBSERVATION_DATE=12/15/25 \
            -e OUTPUT_DIR=/out \
            -v "${{ github.workspace }}/smoke-out:/out" \
            uptonight:smoke

      - name: Verify output
        run: |
          set -euo pipefail
          echo "=== output directory ==="
          ls -la smoke-out

          test -f smoke-out/uptonight-report.txt
          test -f smoke-out/uptonight-report.json
          ls smoke-out/*plot*.png >/dev/null

          # The report must contain at least one observable target.
          count=$(jq '.["target name"] | length' smoke-out/uptonight-report.json)
          echo "targets in report: ${count}"
          test "${count}" -gt 0

          echo "Smoke test passed."
